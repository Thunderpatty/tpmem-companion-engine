# companion-engine — OPTIONAL transport bridge config.
# Copy to ~/.config/tpmem-daemon/config.yaml   (only needed if you enable a transport).
#
# The DEFAULT interface is the local gateway webapp — you do NOT need this file for
# that. This config only configures the optional external transport bridge, which lets
# you also reach your agents from Telegram or email. Both transports are OFF by default.

# Which agent incoming external messages are routed to (must be a slug in the registry).
default_agent: companion

transports:
  telegram:
    enabled: false            # flip to true to receive/reply over Telegram
    # Telegram user IDs allowed to talk to the bot. ANYTHING not in this list is ignored.
    # Find yours: message your bot, then GET https://api.telegram.org/bot<TOKEN>/getUpdates
    user_ids:
      - 000000000             # replace with your Telegram user id
    chunk_chars: 3800         # Telegram's hard limit is 4096; leave a margin

  email:
    enabled: false            # flip to true to ingest allowlisted email
    poll_interval_seconds: 60
    max_body_chars: 20000
    # Substring match against the From: address (lowercased). NOTE: email From: is
    # spoofable — keep this tight and treat email payloads as untrusted input.
    sender_allowlist:
      - "you@example.com"

logging:
  path: ~/.tpmem/transport-bridge.log
  level: INFO
